services:
  - type: web
    name: lunchmate-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: YOUPI_MERCHANT_VPA
        value: lunchmate.escrow@icici
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
